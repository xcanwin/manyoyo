# 发布 npm 包。触发：Release 公开（published）时自动运行；也可手动对某个 tag 重跑（workflow_dispatch + tag 输入）。
# Release 先以草稿建好并挂齐安装包，再由发布控制台公开——草稿不创建 tag，所以 npm 发布不会早于安装包就位。
# 本工作流不创建 Release。预发布（prerelease）不触发 npm 发布，避免把它推到 latest 标签。
# 注意：workflow_dispatch 要求本文件已存在于默认分支。

name: Node.js Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布到 npm 的 tag，如 v8.3.2（对应 Release 已公开）'
        required: true
      skipTests:
        description: '跳过 npm test（发布流水线已在同一提交上测试过）；必须同时给 sha，且 tag 指向的提交要与它一致'
        type: boolean
        required: false
        default: false
      sha:
        description: '流水线测试过的提交；skipTests 为 true 时必填，tag 指向别的提交就拒绝发布'
        required: false
        default: ''

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  build:
    if: (github.event_name != 'release' || !github.event.release.prerelease) && inputs.skipTests != true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Verify tag matches package version
        run: |
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "tag 格式错误，应为 vX.Y.Z: $TAG"; exit 1; }
          TAG_VERSION="${TAG#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version mismatch: tag=$TAG_VERSION package.json=$PKG_VERSION"
            exit 1
          fi
      - run: npm ci --include=optional
      - run: npm run build --if-present
      - run: npm run build:web
      - run: npm test

  publish-npm:
    needs: build
    # build 被 skipTests 跳过时也要继续；build 失败 / 取消、或 release 是预发布时不发布
    if: ${{ !failure() && !cancelled() && (github.event_name != 'release' || !github.event.release.prerelease) }}
    runs-on: ubuntu-24.04
    permissions:
      id-token: write  # Required for OIDC
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: With skipTests the tag must point at the commit the pipeline tested
        if: inputs.skipTests == true
        env:
          TESTED_SHA: ${{ inputs.sha }}
        run: |
          printf '%s' "$TESTED_SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "skipTests 需要 sha（40 位提交号）: $TESTED_SHA"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$TESTED_SHA" ] || { echo "tag $TAG 指向 $(git rev-parse HEAD)，不是流水线测试过的 $TESTED_SHA，拒绝发布"; exit 1; }
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org/
      - run: npm ci --include=optional
      - name: Scan npm package for private data
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
          node scripts/scan-release-artifacts.js --auto-identity \
            --allowlist scripts/release-scan-allowlist.json \
            "$RUNNER_TEMP"/pack/*.tgz
      - run: npm publish --access public --provenance
