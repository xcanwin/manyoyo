# TEMP 实验（交付前删除）：.run 自校验为什么慢——文件 / 管道 / tail / openssl / 解包 各自耗时
name: TMP hash experiment
on:
  push:
    branches:
      - feat/autopilot-2
    paths:
      - '.release-hash-experiment'
permissions:
  contents: read
jobs:
  hash:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Real package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release download v8.6.4 -R xcanwin/manyoyo -p 'manyoyo-8.6.4-macos-arm64.run' -D .
          ls -l manyoyo-8.6.4-macos-arm64.run
      - name: Timings
        run: |
          set -u
          f=manyoyo-8.6.4-macos-arm64.run
          line=$(awk '/^__MANYOYO_PAYLOAD_BELOW__$/ { print NR; exit }' "$f"); skip=$(head -n "$line" "$f" | wc -c | tr -d ' ')
          echo "header lines $line bytes $skip"
          t() { label="$1"; shift; s=$(date +%s); sh -c "$*" > /tmp/out.txt 2>&1; e=$(date +%s); echo "[$label] $((e - s)) 秒  $(cut -c1-60 /tmp/out.txt | head -1)"; }
          t "shasum file" "shasum -a 256 $f"
          t "openssl file" "/usr/bin/openssl dgst -sha256 $f"
          t "cat | shasum" "cat $f | shasum -a 256"
          t "tail -c | shasum" "tail -c +$((skip + 1)) $f | shasum -a 256"
          t "tail -c | openssl" "tail -c +$((skip + 1)) $f | /usr/bin/openssl dgst -sha256"
          t "tail -c | wc" "tail -c +$((skip + 1)) $f | wc -c"
          t "tail -n | wc" "tail -n +$((line + 1)) $f | wc -c"
          mkdir -p ex
          t "tail -c | tar -xzf" "tail -c +$((skip + 1)) $f | tar -xzf - -C ex"
          t "tail -c | gzip -dc | wc" "tail -c +$((skip + 1)) $f | gzip -dc | wc -c"
          du -sh ex | tail -1
