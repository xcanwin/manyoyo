# TEMP 实验（交付前删除）：.run 自校验为什么慢——文件 / 管道 / tail / openssl / 解包 各自耗时
name: TMP hash experiment
on:
  push:
    branches:
      - feat/autopilot-2
    paths:
      - '.release-hash-experiment'
permissions:
  contents: read
jobs:
  hash:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Real package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release download v8.6.4 -R xcanwin/manyoyo -p 'manyoyo-8.6.4-macos-arm64.run' -D .
          ls -l manyoyo-8.6.4-macos-arm64.run
      - name: Timings
        run: |
          set -u
          f=manyoyo-8.6.4-macos-arm64.run
          line=$(awk '/^__MANYOYO_PAYLOAD_BELOW__$/ { print NR; exit }' "$f"); skip=$(head -n "$line" "$f" | wc -c | tr -d ' ')
          echo "header lines $line bytes $skip"
          t() { label="$1"; shift; s=$(date +%s); sh -c "$*" > /tmp/out.txt 2>&1; e=$(date +%s); echo "[$label] $((e - s)) 秒  $(cut -c1-60 /tmp/out.txt | head -1)"; }
          t "tail -c | wc (baseline)" "tail -c +$((skip + 1)) $f | wc -c"
          t "dd+cat | wc" "( dd bs=$skip count=1 of=/dev/null 2>/dev/null; cat ) < $f | wc -c"
          t "dd+cat | shasum" "( dd bs=$skip count=1 of=/dev/null 2>/dev/null; cat ) < $f | shasum -a 256"
          t "dd+cat | gzip -dc | wc" "( dd bs=$skip count=1 of=/dev/null 2>/dev/null; cat ) < $f | gzip -dc | wc -c"
          mkdir -p ex
          t "dd+cat | tar -xzf" "( dd bs=$skip count=1 of=/dev/null 2>/dev/null; cat ) < $f | tar -xzf - -C ex"
          ( dd bs=$skip count=1 of=/dev/null 2>/dev/null; cat ) < $f | shasum -a 256 | cut -c1-16
          tail -c +$((skip + 1)) $f | head -c 100 | shasum -a 256 | cut -c1-16
          ( dd bs=$skip count=1 of=/dev/null 2>/dev/null; cat ) < $f | head -c 100 | shasum -a 256 | cut -c1-16
