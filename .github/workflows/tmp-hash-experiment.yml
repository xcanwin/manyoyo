# TEMP 实验（交付前删除）：macOS 上 shasum 与 openssl 对 2GB 文件算 SHA256 的耗时
name: TMP hash experiment
on:
  push:
    branches:
      - feat/autopilot-2
    paths:
      - '.release-hash-experiment'
permissions:
  contents: read
jobs:
  hash:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - run: |
          set -u
          dd if=/dev/urandom of=big.bin bs=1m count=2000 2>/dev/null
          ls -l big.bin
          t() { s=$(date +%s); "$@" > /tmp/out.txt 2>&1; e=$(date +%s); echo "$* => $((e - s)) 秒 $(cut -c1-70 /tmp/out.txt | head -1)"; }
          printf '#!/bin/sh\nheader line\n__MARK__\n' > run.bin; cat big.bin >> run.bin
          t sh -c "tail -n +\$(awk '/^__MARK__\$/ { print NR + 1; exit }' run.bin) run.bin | shasum -a 256"
          t sh -c "tail -n +\$(awk '/^__MARK__\$/ { print NR + 1; exit }' run.bin) run.bin | /usr/bin/openssl dgst -sha256"
          line=$(awk '/^__MARK__$/ { print NR + 1; exit }' run.bin); skip=$(head -n "$((line - 1))" run.bin | wc -c | tr -d ' ')
          t sh -c "tail -c +$((skip + 1)) run.bin | shasum -a 256"
          t sh -c "tail -c +$((skip + 1)) run.bin | /usr/bin/openssl dgst -sha256"
          t sh -c "tail -c +$((skip + 1)) run.bin | wc -c"
