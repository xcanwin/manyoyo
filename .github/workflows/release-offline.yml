# 把某次 "Build Offline Packages" 运行产出的离线包挂到已有的 GitHub Release 上。
# 为什么单独成一个手动工作流：发布出去的离线包只能来自 CI 里构建并扫描过的产物，
# 这里只做“下载那次运行的产物 → 核对校验和 → 上传”，不重新构建，也不创建 Release、不推送 tag
# （创建 Release 会顺带创建 tag，而 v* tag 会触发 npm 发布）。
# 前提：目标 tag 的 Release 已经存在（草稿或已发布均可，由 npm-publish.yml 或你手动创建）。
# manyoyo update 依赖这里上传的 app 包、SHA256SUMS-macos-<arch> 与 release-manifest-macos-<arch>.json。

name: Release Offline Packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release 的 tag，如 v8.0.0（必须与离线包文件名里的版本一致）'
        required: true
      runId:
        description: '"Build Offline Packages" 那次成功运行的 ID'
        required: true

jobs:
  attach:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      RUN_ID: ${{ inputs.runId }}
    steps:
      - name: Validate inputs
        run: |
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "tag 格式错误，应为 vX.Y.Z: $TAG"; exit 1; }
          printf '%s' "$RUN_ID" | grep -Eq '^[0-9]+$' || { echo "runId 必须是数字: $RUN_ID"; exit 1; }
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Check the source run is a successful offline package build
        run: |
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json workflowName,conclusion,headSha \
            --jq '[.workflowName, .conclusion, .headSha] | @tsv' | tee run.tsv
          cut -f1 run.tsv | grep -qx 'Build Offline Packages' || { echo "这次运行不是 Build Offline Packages"; exit 1; }
          cut -f2 run.tsv | grep -qx 'success' || { echo "这次运行没有成功（含扫描），不能发布"; exit 1; }

      - name: Check the Release exists (this workflow never creates one)
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || { echo "Release $TAG 不存在。请先创建（或等 npm-publish 创建），再运行本工作流。"; exit 1; }

      - name: Download the offline package artifacts of that run
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ inputs.runId }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          pattern: manyoyo-*-macos-*
          merge-multiple: true
          path: assets

      - name: Verify checksums and that every file belongs to this version
        run: |
          cd assets
          ls -l
          for arch in arm64 x64; do
            [ -f "SHA256SUMS-macos-$arch" ] || { echo "缺少 SHA256SUMS-macos-$arch"; exit 1; }
            sha256sum -c "SHA256SUMS-macos-$arch"
          done
          for f in manyoyo-*; do
            case "$f" in
              "manyoyo-${VERSION}-macos-"*) ;;
              *) echo "文件 $f 不属于版本 $VERSION"; exit 1 ;;
            esac
          done
          cat SHA256SUMS-macos-arm64 SHA256SUMS-macos-x64 > SHA256SUMS

      - name: Upload to the Release (explicit file list, no wildcards)
        run: |
          cd assets
          FILES=""
          for arch in arm64 x64; do
            for name in "manyoyo-${VERSION}-macos-${arch}"*.run "manyoyo-${VERSION}-macos-${arch}"*.run.[0-9][0-9][0-9] "manyoyo-${VERSION}-macos-${arch}-app.tar.gz" "SHA256SUMS-macos-${arch}" "release-manifest-macos-${arch}.json"; do
              [ -f "$name" ] && FILES="$FILES $name"
            done
          done
          FILES="$FILES SHA256SUMS"
          echo "上传: $FILES"
          # shellcheck disable=SC2086
          gh release upload "$TAG" $FILES --repo "$GITHUB_REPOSITORY" --clobber
