# 把 "Build Packages" 一次成功运行的产物（macOS + Linux 共四个平台）一次性挂到已有的 GitHub Release 上。
# 为什么单独成一个手动工作流：发布出去的离线包只能来自 CI 里构建并扫描过的产物，
# 这里只做“下载这次运行的产物 → 核对校验和 → 合并出唯一的 SHA256SUMS → 上传”，不重新构建，也不创建 / 公开 Release、不推送 tag
# （创建或公开 Release 会产生 tag，而 v* tag / release published 会触发 npm 发布）。
# 前提：目标 tag 的 Release 已经存在，通常是发布控制台建好的草稿（草稿不创建 tag、不会成为 latest）；资产齐全后再由控制台公开。
# 上传后 Release 里的资产：4 个 .run（安装包；Intel 完整包超过 2 GiB 时分卷为 .run.001/.002…）、4 个 -app.tar.gz（manyoyo update 自动下载，不需要手动下）、1 个 SHA256SUMS（唯一校验清单，资产集合以它为准）。
# manyoyo update 依赖这里上传的 -app.tar.gz 与 SHA256SUMS，两个名字不能改。

name: Release Offline Packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release 的 tag，如 v8.1.0（必须与离线包文件名里的版本一致）'
        required: true
      runId:
        description: 'Build Packages 那次成功运行的 ID'
        required: true

jobs:
  attach:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      RUN_ID: ${{ inputs.runId }}
    steps:
      - name: Validate inputs
        run: |
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "tag 格式错误，应为 vX.Y.Z: $TAG"; exit 1; }
          printf '%s' "$RUN_ID" | grep -Eq '^[0-9]+$' || { echo "runId 必须是数字: $RUN_ID"; exit 1; }
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Check the source run is a successful Build Packages run
        run: |
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json workflowName,conclusion,headSha \
            --jq '[.workflowName, .conclusion, .headSha] | @tsv' | tee run.tsv
          cut -f1 run.tsv | grep -qx 'Build Packages' || { echo "运行 $RUN_ID 不是 Build Packages"; exit 1; }
          cut -f2 run.tsv | grep -qx 'success' || { echo "运行 $RUN_ID 没有成功（含扫描），不能发布"; exit 1; }
          echo "RUN_SHA=$(cut -f3 run.tsv)" >> "$GITHUB_ENV"

      - name: Check the Release exists and was pinned to the commit the packages were built from (this workflow never creates one)
        run: |
          # gh release view 能看到草稿（本工作流的 token 有 contents: write）；草稿阶段 targetCommitish 就是创建时钉的提交
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish \
            --jq '[.isDraft, .targetCommitish] | @tsv' > release.tsv \
            || { echo "Release $TAG 不存在。请先创建（草稿即可），再运行本工作流。"; exit 1; }
          cat release.tsv
          target="$(cut -f2 release.tsv)"
          [ "$target" = "$RUN_SHA" ] || { echo "Release $TAG 钉的提交（$target）与安装包构建的提交（$RUN_SHA）不同，tag、npm 包与安装包会来自不同代码"; exit 1; }

      - name: Download the macOS offline package artifacts
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ inputs.runId }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          pattern: manyoyo-*-macos-*
          merge-multiple: true
          path: assets

      - name: Download the Linux offline package artifacts
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ inputs.runId }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          pattern: manyoyo-*-linux-*
          merge-multiple: true
          path: assets

      - name: Verify checksums and that every file belongs to this version, then merge into the single SHA256SUMS
        run: |
          cd assets
          ls -l
          for os in macos linux; do
            for arch in arm64 x64; do
              [ -f "SHA256SUMS-${os}-${arch}" ] || { echo "缺少 SHA256SUMS-${os}-${arch}"; exit 1; }
              sha256sum -c "SHA256SUMS-${os}-${arch}"
            done
          done
          for f in manyoyo-*; do
            case "$f" in
              "manyoyo-${VERSION}-macos-"*|"manyoyo-${VERSION}-linux-"*) ;;
              *) echo "文件 $f 不属于版本 $VERSION"; exit 1 ;;
            esac
          done
          ls manyoyo-*-lite.run >/dev/null 2>&1 && { echo "不应再有精简包 -lite.run"; exit 1; }
          # Release 里唯一的校验清单：把四份分平台清单合并（分平台清单只在 artifact 里，不上传）
          cat SHA256SUMS-macos-arm64 SHA256SUMS-macos-x64 SHA256SUMS-linux-arm64 SHA256SUMS-linux-x64 > SHA256SUMS

      - name: SHA256SUMS must list exactly the files to upload
        run: |
          cd assets
          expected="$(
            for os in macos linux; do
              for arch in arm64 x64; do
                ls "manyoyo-${VERSION}-${os}-${arch}.run" "manyoyo-${VERSION}-${os}-${arch}".run.[0-9][0-9][0-9] "manyoyo-${VERSION}-${os}-${arch}-app.tar.gz" 2>/dev/null
              done
            done | sort
          )"
          listed="$(awk '{print $2}' SHA256SUMS | sed 's/^\*//' | sort)"
          [ "$expected" = "$listed" ] || { echo "SHA256SUMS 与待上传文件不一致"; printf '待上传:\n%s\n清单:\n%s\n' "$expected" "$listed"; exit 1; }

      - name: Upload to the Release (explicit file list, no wildcards)
        run: |
          cd assets
          FILES="SHA256SUMS"
          for os in macos linux; do
            for arch in arm64 x64; do
              # 每个平台/架构必须有安装包（单文件，超限时为分卷）和升级包，缺一个就中止，避免发布残缺的 Release
              [ -f "manyoyo-${VERSION}-${os}-${arch}.run" ] || [ -f "manyoyo-${VERSION}-${os}-${arch}.run.001" ] || { echo "缺少 ${os}-${arch} 的安装包"; exit 1; }
              [ -f "manyoyo-${VERSION}-${os}-${arch}-app.tar.gz" ] || { echo "缺少 ${os}-${arch} 的升级包"; exit 1; }
              for name in "manyoyo-${VERSION}-${os}-${arch}.run" "manyoyo-${VERSION}-${os}-${arch}".run.[0-9][0-9][0-9] "manyoyo-${VERSION}-${os}-${arch}-app.tar.gz"; do
                [ -f "$name" ] && FILES="$FILES $name"
              done
            done
          done
          echo "上传: $FILES"
          # shellcheck disable=SC2086
          gh release upload "$TAG" $FILES --repo "$GITHUB_REPOSITORY" --clobber
