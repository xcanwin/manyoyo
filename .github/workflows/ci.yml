# 分支 / PR 阶段的持续集成：和本地预检同一组检查（合并 main 之前就知道测试是否通过，不必等 tag 之后的 npm-publish）。
# main 不在这里跑（合并前已经在分支上跑过）；前端 lint 有既存报错，不作为门禁，只跑 typecheck。
# 只读权限、不用任何密钥。

name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
  # 发布流水线（release-pipeline.yml）复用同一组检查
  workflow_call:

concurrency:
  # 带上 workflow 名：被发布流水线复用时 github.workflow 是流水线的名字，不会与同一 ref 上独立触发的 CI 互相取消
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # TEMP-FAIL（试跑用，交付前删除）
      - name: TEMP-FAIL test
        if: contains(github.event.head_commit.message, 'FAIL-TEST')
        run: exit 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=optional
      # build:web 会顺带安装 frontend 依赖，并生成 npm test 里 Web 页面用例需要的 lib/web/index.html
      - run: npm run build:web
      - run: npm test
      - run: npm run docs:check
      - run: npm run lint:sh
      - name: Frontend typecheck
        run: npm run typecheck
        working-directory: frontend
