name: Publish Container Image

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Read and verify release versions
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p \"require('./package.json').version\")"
          IMAGE_VERSION="$(node -p \"require('./package.json').imageVersion\")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version mismatch: tag=$TAG_VERSION package.json=$PACKAGE_VERSION"
            exit 1
          fi
          echo "image_version=$IMAGE_VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/manyoyo.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/manyoyo:${{ steps.version.outputs.image_version }}
            ghcr.io/${{ github.repository_owner }}/manyoyo:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
      - name: Publish image digest summary
        run: |
          echo "image_digest=${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "image_version=${{ steps.version.outputs.image_version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "tool_manifest_schema=$(node -p \"require('./docker/tool-manifest.json').schemaVersion\")" >> "$GITHUB_STEP_SUMMARY"
      - name: Build release metadata
        run: |
          node scripts/release-metadata.js \
            --image-repository "ghcr.io/${{ github.repository_owner }}/manyoyo" \
            --image-digest "${{ steps.image.outputs.digest }}" > manyoyo-release-metadata.json
      - name: Upload image release metadata
        uses: actions/upload-artifact@v4
        with:
          name: manyoyo-release-metadata-image-${{ steps.version.outputs.image_version }}
          path: |
            docker/tool-manifest.json
            manyoyo-release-metadata.json
