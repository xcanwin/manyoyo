# 构建并发布预构建镜像 ghcr.io/xcanwin/manyoyo:<imageVersion>（linux/amd64 + linux/arm64），
# 同时按架构产出镜像归档 artifact，供离线包组装使用。
# 镜像源：GitHub runner 在海外，访问国内镜像仅约 120 kB/s，所以这里改用官方源（APT_MIRROR 置空即不改写 apt 源）。
# 只能手动触发；不会被推送分支或 tag 触发。构建参数不含任何凭据。

name: Publish Image

on:
  workflow_dispatch:
    inputs:
      imageVersion:
        description: '镜像版本，格式 x.y.z-后缀（留空则读取 package.json 的 imageVersion）'
        required: false
        default: ''

env:
  IMAGE_NAME: ghcr.io/xcanwin/manyoyo

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      imageVersion: ${{ steps.version.outputs.imageVersion }}
    steps:
      - uses: actions/checkout@v7

      # Dockerfile 第一阶段 COPY docker/cache/（缓存可为空，但目录必须存在；
      # 该目录被 .gitignore 忽略，全新 checkout 里没有，空目录让构建在容器内自行下载）
      - name: Prepare empty build cache directory
        run: mkdir -p docker/cache

      - name: Resolve image version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.imageVersion }}
        run: |
          VERSION="${INPUT_VERSION}"
          if [ -z "$VERSION" ]; then
            VERSION="$(node -p "require('./package.json').imageVersion")"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-[A-Za-z0-9][A-Za-z0-9_.-]*$'; then
            echo "imageVersion 格式错误，必须为 x.y.z-后缀: $VERSION"
            exit 1
          fi
          echo "imageVersion=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tool=${VERSION#*-}" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/manyoyo.Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            TOOL=${{ steps.version.outputs.tool }}
            APT_MIRROR=
            NODEJS_MIRROR=https://nodejs.org/dist
            NPM_REGISTRY=https://registry.npmjs.org/
            PIP_INDEX_URL=https://pypi.org/simple
          tags: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.imageVersion }}
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare archive output directory
        run: mkdir -p out

      - name: Build amd64 archive
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/manyoyo.Dockerfile
          platforms: linux/amd64
          build-args: |
            TOOL=${{ steps.version.outputs.tool }}
            APT_MIRROR=
            NODEJS_MIRROR=https://nodejs.org/dist
            NPM_REGISTRY=https://registry.npmjs.org/
            PIP_INDEX_URL=https://pypi.org/simple
          tags: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.imageVersion }}
          outputs: type=docker,dest=out/manyoyo-${{ steps.version.outputs.imageVersion }}-amd64.tar
          provenance: false
          cache-from: type=gha

      - name: Build arm64 archive
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/manyoyo.Dockerfile
          platforms: linux/arm64
          build-args: |
            TOOL=${{ steps.version.outputs.tool }}
            APT_MIRROR=
            NODEJS_MIRROR=https://nodejs.org/dist
            NPM_REGISTRY=https://registry.npmjs.org/
            PIP_INDEX_URL=https://pypi.org/simple
          tags: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.imageVersion }}
          outputs: type=docker,dest=out/manyoyo-${{ steps.version.outputs.imageVersion }}-arm64.tar
          provenance: false
          cache-from: type=gha

      - name: Upload image archives
        uses: actions/upload-artifact@v7
        with:
          name: manyoyo-image-${{ steps.version.outputs.imageVersion }}
          path: out/*.tar
          retention-days: 7
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "### 镜像已发布"
            echo "- 镜像: \`${IMAGE_NAME}:${{ steps.version.outputs.imageVersion }}\`"
            echo "- digest: \`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
