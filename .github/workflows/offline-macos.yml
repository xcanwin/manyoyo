# 构建 macOS 离线包（完整包 / 精简包 / app 升级包）并运行隐私扫描，只产出 workflow artifact。
# 只能手动触发；不创建 Release、不推送任何东西。发布产物只能在这里（干净的 CI 环境）构建，不要在维护者本机构建上传。
# 前提：镜像已由 "Publish Image" workflow 推送到 ghcr.io/xcanwin/manyoyo:<imageVersion>。

name: Build Offline Packages

on:
  workflow_dispatch:
    inputs:
      imageVersion:
        description: '镜像版本，格式 x.y.z-后缀（留空则读取 package.json 的 imageVersion，必须已发布到 ghcr.io）'
        required: false
        default: ''

env:
  IMAGE_NAME: ghcr.io/xcanwin/manyoyo

jobs:
  image-archive:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            platform: linux/arm64
          - arch: x64
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.imageVersion }}
        run: |
          VERSION="${INPUT_VERSION}"
          if [ -z "$VERSION" ]; then
            VERSION="$(node -p "require('./package.json').imageVersion")"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-[A-Za-z0-9][A-Za-z0-9_.-]*$'; then
            echo "imageVersion 格式错误，必须为 x.y.z-后缀: $VERSION"
            exit 1
          fi
          echo "imageVersion=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Pull and save the image for ${{ matrix.platform }}
        run: |
          mkdir -p image
          docker pull --platform "${{ matrix.platform }}" "${IMAGE_NAME}:${{ steps.version.outputs.imageVersion }}"
          docker save "${IMAGE_NAME}:${{ steps.version.outputs.imageVersion }}" | gzip -n > "image/manyoyo-${{ steps.version.outputs.imageVersion }}-${{ matrix.arch }}.tar.gz"
          ls -lh image

      - uses: actions/upload-artifact@v7
        with:
          name: manyoyo-image-${{ steps.version.outputs.imageVersion }}-${{ matrix.arch }}
          path: image/manyoyo-${{ steps.version.outputs.imageVersion }}-${{ matrix.arch }}.tar.gz
          retention-days: 3
          if-no-files-found: error

  build:
    needs: image-archive
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # 产物名带版本号：manyoyo-<version>-macos-<arch>，下载下来的 zip 一眼能认
      - name: Resolve versions
        id: version
        env:
          INPUT_VERSION: ${{ inputs.imageVersion }}
        run: |
          IMAGE_VERSION="${INPUT_VERSION}"
          if [ -z "$IMAGE_VERSION" ]; then
            IMAGE_VERSION="$(node -p "require('./package.json').imageVersion")"
          fi
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "imageVersion=$IMAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install GNU tar (reproducible, normalized archives)
        run: |
          brew install gnu-tar
          echo "MANYOYO_TAR=$(brew --prefix)/opt/gnu-tar/libexec/gnubin/tar" >> "$GITHUB_ENV"

      - run: npm ci --include=optional
      - run: npm run build:web-shadcn

      - uses: actions/download-artifact@v8
        with:
          name: manyoyo-image-${{ steps.version.outputs.imageVersion }}-${{ matrix.arch }}
          path: image

      - name: Build packages
        run: |
          node scripts/offline/build.js --arch "${{ matrix.arch }}" \
            --image-archive "$(ls image/manyoyo-*-${{ matrix.arch }}.tar.gz)" \
            --out dist-offline

      # 发布前扫描：扫描失败即整个 job 失败，产物不会上传。
      # full 目录树是 lite / app 的超集，扫它即覆盖。其中 images/（镜像归档）下一步用镜像专用允许列表单独扫，
      # vm/（官方未启动过的 machine-os 磁盘，不透明压缩文件）由 manifest 记录的 SHA256 约束，不做字符串扫描。
      - name: Scan packaged tree
        run: |
          node scripts/scan-release-artifacts.js --auto-identity --no-inventory \
            --allowlist scripts/offline/scan-allowlist.json \
            --exclude '^full/images(/|$)' --exclude '^full/vm(/|$)' \
            dist-offline/work/staging/full
      - name: Scan image archive
        run: |
          node scripts/scan-release-artifacts.js --auto-identity --no-inventory \
            --allowlist scripts/offline/scan-allowlist-image.json \
            "$(ls image/manyoyo-*-${{ matrix.arch }}.tar.gz)"

      # 上传按构建脚本输出的显式文件清单，不用通配符，避免带上多余文件
      - name: List deliverables
        id: files
        run: |
          {
            echo 'list<<MANYOYO_FILES_EOF'
            cat "dist-offline/FILES-macos-${{ matrix.arch }}.txt"
            echo 'MANYOYO_FILES_EOF'
          } >> "$GITHUB_OUTPUT"
          cat "dist-offline/FILES-macos-${{ matrix.arch }}.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: manyoyo-${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}
          path: ${{ steps.files.outputs.list }}
          retention-days: 7
          if-no-files-found: error
